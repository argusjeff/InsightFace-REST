<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsightFace-REST - Face Recognition Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .face-box {
            position: absolute;
            border: 3px solid #10b981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3);
        }
        .face-label {
            position: absolute;
            background: #10b981;
            color: white;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 3px;
            white-space: nowrap;
        }
        .landmark {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ef4444;
            border-radius: 50%;
            border: 1px solid white;
            transform: translate(-3px, -3px);
        }
        .loading {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .tab-active {
            border-bottom: 3px solid #3b82f6;
            color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-white shadow-sm border-b">
            <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="text-3xl font-bold text-gray-900">InsightFace-REST</h1>
                        <p class="text-sm text-gray-600">Face Detection & Recognition Demo</p>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="checkHealth()" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 transition">
                            Health Check
                        </button>
                        <button onclick="getInfo()" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition">
                            Server Info
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
            <!-- API Settings -->
            <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                <h2 class="text-xl font-semibold mb-4">API Configuration</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">API URL</label>
                        <input type="text" id="apiUrl" value="http://localhost:18081"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Detection Threshold</label>
                        <input type="number" id="threshold" value="0.6" min="0" max="1" step="0.05"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Max Faces</label>
                        <input type="number" id="limitFaces" value="0" min="0"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                        <p class="text-xs text-gray-500 mt-1">0 = unlimited</p>
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="bg-white rounded-lg shadow-sm mb-6">
                <div class="flex border-b">
                    <button onclick="switchTab('image')" id="tab-image" class="tab-active px-6 py-3 font-medium">
                        📷 Image Processing
                    </button>
                    <button onclick="switchTab('video')" id="tab-video" class="px-6 py-3 font-medium text-gray-600 hover:text-gray-900">
                        🎥 Video Processing
                    </button>
                    <button onclick="switchTab('draw')" id="tab-draw" class="px-6 py-3 font-medium text-gray-600 hover:text-gray-900">
                        🎨 Draw Detections
                    </button>
                </div>

                <!-- Image Tab -->
                <div id="content-image" class="p-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Upload Section -->
                        <div>
                            <h3 class="text-lg font-semibold mb-4">Upload Image</h3>
                            <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-400 transition">
                                <input type="file" id="imageFile" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                                <label for="imageFile" class="cursor-pointer">
                                    <div class="text-4xl mb-2">📁</div>
                                    <p class="text-sm text-gray-600">Click to upload image</p>
                                    <p class="text-xs text-gray-400 mt-1">JPEG, PNG, BMP, WebP</p>
                                </label>
                            </div>

                            <div class="mt-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Or paste image URL</label>
                                <div class="flex gap-2">
                                    <input type="text" id="imageUrl" placeholder="https://example.com/image.jpg"
                                           class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                                    <button onclick="processImageUrl()" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition">
                                        Load
                                    </button>
                                </div>
                            </div>

                            <!-- Options -->
                            <div class="mt-6 space-y-2">
                                <label class="flex items-center">
                                    <input type="checkbox" id="extractEmbedding" checked class="mr-2">
                                    <span class="text-sm">Extract Embeddings</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="checkbox" id="extractGA" class="mr-2">
                                    <span class="text-sm">Extract Gender & Age</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="checkbox" id="returnLandmarks" checked class="mr-2">
                                    <span class="text-sm">Show Landmarks</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="checkbox" id="detectMasks" class="mr-2">
                                    <span class="text-sm">Detect Masks</span>
                                </label>
                            </div>

                            <button onclick="processImage()" id="processBtn" class="w-full mt-6 px-4 py-3 bg-green-500 text-white rounded-lg hover:bg-green-600 transition font-semibold">
                                🚀 Process Image
                            </button>
                        </div>

                        <!-- Preview Section -->
                        <div>
                            <h3 class="text-lg font-semibold mb-4">Preview</h3>
                            <div id="imagePreview" class="relative border border-gray-300 rounded-lg overflow-hidden bg-gray-100 min-h-[400px] flex items-center justify-center">
                                <p class="text-gray-400">No image loaded</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Video Tab -->
                <div id="content-video" class="p-6 hidden">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <h3 class="text-lg font-semibold mb-4">Upload Video</h3>
                            <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-400 transition">
                                <input type="file" id="videoFile" accept="video/*" class="hidden" onchange="handleVideoUpload(event)">
                                <label for="videoFile" class="cursor-pointer">
                                    <div class="text-4xl mb-2">🎬</div>
                                    <p class="text-sm text-gray-600">Click to upload video</p>
                                    <p class="text-xs text-gray-400 mt-1">MP4, WebM, AVI</p>
                                </label>
                            </div>

                            <div class="mt-6">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Frame Sampling Rate</label>
                                <input type="number" id="frameRate" value="30" min="1" max="60"
                                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                                <p class="text-xs text-gray-500 mt-1">Process 1 frame every N frames</p>
                            </div>

                            <button onclick="processVideo()" id="processVideoBtn" disabled class="w-full mt-6 px-4 py-3 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition font-semibold disabled:bg-gray-300 disabled:cursor-not-allowed">
                                🎥 Extract & Process Frames
                            </button>
                        </div>

                        <div>
                            <h3 class="text-lg font-semibold mb-4">Video Preview</h3>
                            <div id="videoPreview" class="border border-gray-300 rounded-lg overflow-hidden bg-gray-100 min-h-[400px] flex items-center justify-center">
                                <p class="text-gray-400">No video loaded</p>
                            </div>
                            <div id="videoProgress" class="mt-4 hidden">
                                <div class="bg-gray-200 rounded-full h-4 overflow-hidden">
                                    <div id="videoProgressBar" class="bg-blue-500 h-full transition-all duration-300" style="width: 0%"></div>
                                </div>
                                <p id="videoProgressText" class="text-sm text-gray-600 mt-2 text-center">Processing...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Draw Tab -->
                <div id="content-draw" class="p-6 hidden">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <h3 class="text-lg font-semibold mb-4">Upload Image for Visualization</h3>
                            <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-400 transition">
                                <input type="file" id="drawFile" accept="image/*" class="hidden" onchange="handleDrawUpload(event)">
                                <label for="drawFile" class="cursor-pointer">
                                    <div class="text-4xl mb-2">🎨</div>
                                    <p class="text-sm text-gray-600">Click to upload image</p>
                                </label>
                            </div>

                            <div class="mt-6 space-y-2">
                                <label class="flex items-center">
                                    <input type="checkbox" id="drawLandmarks" checked class="mr-2">
                                    <span class="text-sm">Draw Landmarks</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="checkbox" id="drawScores" checked class="mr-2">
                                    <span class="text-sm">Draw Scores</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="checkbox" id="drawSizes" checked class="mr-2">
                                    <span class="text-sm">Draw Face Sizes</span>
                                </label>
                            </div>

                            <button onclick="drawDetections()" id="drawBtn" disabled class="w-full mt-6 px-4 py-3 bg-indigo-500 text-white rounded-lg hover:bg-indigo-600 transition font-semibold disabled:bg-gray-300 disabled:cursor-not-allowed">
                                🎨 Draw Detections
                            </button>
                        </div>

                        <div>
                            <h3 class="text-lg font-semibold mb-4">Result</h3>
                            <div id="drawResult" class="border border-gray-300 rounded-lg overflow-hidden bg-gray-100 min-h-[400px] flex items-center justify-center">
                                <p class="text-gray-400">No result yet</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Results Section -->
            <div id="resultsSection" class="hidden bg-white rounded-lg shadow-sm p-6">
                <h2 class="text-xl font-semibold mb-4">Detection Results</h2>
                <div id="results"></div>
            </div>
        </main>
    </div>

    <!-- Hidden canvas for video frame extraction -->
    <canvas id="videoCanvas" style="display: none;"></canvas>

    <script src="app.js"></script>
</body>
</html>
